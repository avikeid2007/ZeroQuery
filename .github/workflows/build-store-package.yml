name: Build & Package for Microsoft Store

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      package_version:
        description: 'Package Version (e.g. 1.0.1.0 - leave empty to keep current manifest version)'
        required: false
        default: ''
      platform:
        description: 'Target Architecture'
        required: true
        default: 'x64'
        type: choice
        options:
          - 'x64'
          - 'arm64'
          - 'both'

permissions:
  contents: write

jobs:
  build:
    name: Build MSIX (${{ github.event.inputs.platform || 'x64' }})
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup .NET SDK (10.0.x preview)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Install Frontend Dependencies & Export Desktop Client
        shell: pwsh
        run: |
          Write-Host "Building Next.js static client into Desktop wwwroot..."
          cd frontend
          npm ci
          npm run build:desktop
          cd ..

      - name: Install & Embed Microsoft Data API Builder (DAB) CLI
        shell: pwsh
        run: |
          Write-Host "Installing Microsoft Data API Builder CLI to temporary staging..."
          New-Item -ItemType Directory -Path "staging-dab" -Force | Out-Null
          dotnet tool install --tool-path staging-dab Microsoft.DataApiBuilder --ignore-failed-sources

          # Locate the executable folder inside .store
          $binDir = (Get-ChildItem -Path "staging-dab" -Recurse -Filter "Microsoft.DataApiBuilder.exe" | Select-Object -First 1).DirectoryName
          if (-not $binDir -or -not (Test-Path $binDir)) {
              Write-Error "Could not find Microsoft.DataApiBuilder.exe in staging-dab!"
              exit 1
          }
          Write-Host "Found DAB binary directory: $binDir"

          # Flatten required binaries directly into Desktop/ZeroQuery.Desktop/tools/dab
          # Copying only files (no subdirectories) avoids language satellite assemblies and win-x64 folder naming that conflict with Windows App SDK MakePri resource indexing
          $targetDir = "Desktop/ZeroQuery.Desktop/tools/dab"
          New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
          Get-ChildItem -Path $binDir -File | Copy-Item -Destination $targetDir -Force

          # Create dab.exe alias for Microsoft.DataApiBuilder.exe
          Copy-Item (Join-Path $targetDir "Microsoft.DataApiBuilder.exe") (Join-Path $targetDir "dab.exe") -Force

          # Clean up temporary staging directory
          Remove-Item -Path "staging-dab" -Recurse -Force

          # Test that embedded dab.exe runs standalone
          $dabExe = Join-Path $targetDir "dab.exe"
          Write-Host "Verifying embedded DAB executable ($dabExe --version):"
          & $dabExe --version
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Embedded DAB failed version check!"
              exit 1
          }
          Write-Host "Successfully embedded standalone DAB CLI into $targetDir"

      - name: Update Package Version in Manifest
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.package_version }}"
          if (-not $ver -and "${{ github.ref }}" -match '^refs/tags/v?(\d+(\.\d+)*)$') {
              $ver = $Matches[1]
          }
          if ($ver) {
              $parts = $ver.Split('.')
              while ($parts.Count -lt 4) { $parts += '0' }
              $quad = ($parts[0..3] -join '.')
              Write-Host "Setting Package.appxmanifest Version to: $quad"
              $manifest = "Desktop/ZeroQuery.Desktop/Package.appxmanifest"
              [xml]$xml = Get-Content $manifest
              $xml.Package.Identity.Version = $quad
              $xml.Save((Resolve-Path $manifest))
          } else {
              Write-Host "Keeping existing Version in Package.appxmanifest"
          }

      - name: Build Store-Ready MSIX Package (x64)
        if: ${{ github.event.inputs.platform == 'x64' || github.event.inputs.platform == 'both' || github.event.inputs.platform == '' }}
        shell: pwsh
        run: |
          Write-Host "Publishing x64 Store MSIX package..."
          $appxDir = Join-Path (Resolve-Path "Desktop/ZeroQuery.Desktop") "AppPackages\"
          dotnet publish Desktop/ZeroQuery.Desktop/ZeroQuery.Desktop.csproj `
            -p:Platform=x64 `
            -c Release `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false `
            -p:AppxPackageDir="$appxDir"
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::dotnet publish (x64) failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
          }

      - name: Build Store-Ready MSIX Package (ARM64)
        if: ${{ github.event.inputs.platform == 'arm64' || github.event.inputs.platform == 'both' }}
        shell: pwsh
        run: |
          Write-Host "Publishing ARM64 Store MSIX package..."
          $appxDir = Join-Path (Resolve-Path "Desktop/ZeroQuery.Desktop") "AppPackages\"
          dotnet publish Desktop/ZeroQuery.Desktop/ZeroQuery.Desktop.csproj `
            -p:Platform=ARM64 `
            -c Release `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false `
            -p:AppxPackageDir="$appxDir"
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::dotnet publish (ARM64) failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
          }

      - name: Prepare .msixupload Packages for Microsoft Partner Center
        shell: pwsh
        run: |
          $outDir = "Desktop/ZeroQuery.Desktop/AppPackages"
          Write-Host "Scanning for generated MSIX output..."
          # The first recursive Get-ChildItem walk after `dotnet publish` has repeatedly returned zero
          # results on these hosted Windows runners even though the files are on disk (the identical
          # walk run a second time a moment later finds them every time) - a directory-entry cache
          # coherency delay, not a pattern/path bug. Retry with a short sleep until files appear.
          $msixFiles = @()
          for ($i = 1; $i -le 10; $i++) {
              $msixFiles = @(Get-ChildItem -Path . -Recurse -Include "*.msix" -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -like "*AppPackages*" -and $_.Name -like "ZeroQuery*" -and $_.FullName -notmatch "Debug" })
              if ($msixFiles.Count -gt 0) { break }
              Write-Host "Attempt $i: no .msix files found yet; sleeping 3s and retrying..."
              Start-Sleep -Seconds 3
          }

          if ($msixFiles.Count -eq 0) {
              Write-Host "::error::No .msix files found anywhere under AppPackages"
              Write-Host "Full repo tree search for any .msix/.msixbundle files:"
              Get-ChildItem -Path . -Recurse -Include "*.msix","*.msixbundle" -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize
              exit 1
          }

          foreach ($file in $msixFiles) {
              $baseName = [System.IO.Path]::GetFileNameWithoutExtension($file.Name)
              $uploadZip = Join-Path $file.DirectoryName "$baseName.msixupload"
              if (-not (Test-Path $uploadZip)) {
                  Write-Host "Generating .msixupload bundle for $($file.Name)..."
                  Compress-Archive -Path $file.FullName -DestinationPath $uploadZip -Force
              }
          }
          
          Write-Host "Generated Store packages in: $outDir"
          Get-ChildItem -Path . -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like "*AppPackages*" -and $_.Extension -match 'msix|msixupload|appxsym' } |
              Select-Object Name, Length, FullName | Format-Table -AutoSize

      - name: Upload Store Packages as Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeroquery-ms-store-packages
          path: |
            Desktop/ZeroQuery.Desktop/AppPackages/**/*.msix
            Desktop/ZeroQuery.Desktop/AppPackages/**/*.msixupload
            AppPackages/**/*.msix
            AppPackages/**/*.msixupload
          if-no-files-found: error
          retention-days: 14

      - name: Attach Packages to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Desktop/ZeroQuery.Desktop/AppPackages/**/*.msix
            Desktop/ZeroQuery.Desktop/AppPackages/**/*.msixupload
            AppPackages/**/*.msix
            AppPackages/**/*.msixupload
          draft: false
          prerelease: false
          generate_release_notes: true
