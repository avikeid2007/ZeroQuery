name: Build & Package for Microsoft Store

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      package_version:
        description: 'Package Version (e.g. 1.0.1.0 - leave empty to keep current manifest version)'
        required: false
        default: ''
      platform:
        description: 'Target Architecture'
        required: true
        default: 'x64'
        type: choice
        options:
          - 'x64'
          - 'arm64'
          - 'both'

permissions:
  contents: write

jobs:
  build:
    name: Build MSIX (${{ github.event.inputs.platform || 'x64' }})
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup .NET SDK (10.0.x preview)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Install Frontend Dependencies & Export Desktop Client
        shell: pwsh
        run: |
          Write-Host "Building Next.js static client into Desktop wwwroot..."
          cd frontend
          npm ci
          npm run build:desktop
          cd ..

      - name: Install & Embed Microsoft Data API Builder (DAB) CLI
        shell: pwsh
        run: |
          Write-Host "Installing and embedding Microsoft Data API Builder CLI into Desktop/ZeroQuery.Desktop/tools/dab..."
          dotnet tool install --tool-path Desktop/ZeroQuery.Desktop/tools/dab Microsoft.DataApiBuilder --ignore-failed-sources
          $installedFiles = Get-ChildItem -Path "Desktop/ZeroQuery.Desktop/tools/dab" -Recurse | Where-Object { $_.Name -match 'dab\.(exe|cmd)$|Microsoft\.DataApiBuilder\.exe$' }
          if ($installedFiles) {
              Write-Host "Successfully embedded DAB CLI into desktop bundle:"
              $installedFiles | Select-Object Name, FullName | Format-Table -AutoSize
          } else {
              Write-Error "DAB CLI failed to install into tools/dab!"
              exit 1
          }

      - name: Update Package Version in Manifest
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.package_version }}"
          if (-not $ver -and "${{ github.ref }}" -match '^refs/tags/v?(\d+(\.\d+)*)$') {
              $ver = $Matches[1]
          }
          if ($ver) {
              $parts = $ver.Split('.')
              while ($parts.Count -lt 4) { $parts += '0' }
              $quad = ($parts[0..3] -join '.')
              Write-Host "Setting Package.appxmanifest Version to: $quad"
              $manifest = "Desktop/ZeroQuery.Desktop/Package.appxmanifest"
              [xml]$xml = Get-Content $manifest
              $xml.Package.Identity.Version = $quad
              $xml.Save((Resolve-Path $manifest))
          } else {
              Write-Host "Keeping existing Version in Package.appxmanifest"
          }

      - name: Build Store-Ready MSIX Package (x64)
        if: ${{ github.event.inputs.platform == 'x64' || github.event.inputs.platform == 'both' || github.event.inputs.platform == '' }}
        shell: pwsh
        run: |
          Write-Host "Publishing x64 Store MSIX package..."
          dotnet publish Desktop/ZeroQuery.Desktop/ZeroQuery.Desktop.csproj `
            -p:Platform=x64 `
            -c Release `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false `
            -p:AppxPackageDir="AppPackages\"

      - name: Build Store-Ready MSIX Package (ARM64)
        if: ${{ github.event.inputs.platform == 'arm64' || github.event.inputs.platform == 'both' }}
        shell: pwsh
        run: |
          Write-Host "Publishing ARM64 Store MSIX package..."
          dotnet publish Desktop/ZeroQuery.Desktop/ZeroQuery.Desktop.csproj `
            -p:Platform=ARM64 `
            -c Release `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false `
            -p:AppxPackageDir="AppPackages\"

      - name: Prepare .msixupload Packages for Microsoft Partner Center
        shell: pwsh
        run: |
          $outDir = "Desktop/ZeroQuery.Desktop/AppPackages"
          Write-Host "Scanning $outDir for generated packages..."
          $msixFiles = Get-ChildItem -Path $outDir -Recurse -Filter "ZeroQuery*.msix" | Where-Object { $_.FullName -notmatch "Debug" }
          
          foreach ($file in $msixFiles) {
              $baseName = [System.IO.Path]::GetFileNameWithoutExtension($file.Name)
              $uploadZip = Join-Path $outDir "$baseName.msixupload"
              if (-not (Test-Path $uploadZip)) {
                  Write-Host "Generating .msixupload bundle for $($file.Name)..."
                  Compress-Archive -Path $file.FullName -DestinationPath $uploadZip -Force
              }
          }
          
          Write-Host "Generated Store packages in: $outDir"
          Get-ChildItem -Path $outDir -Recurse | Where-Object { $_.Extension -match 'msix|msixupload|appxsym' } | Select-Object Name, Length, FullName | Format-Table -AutoSize

      - name: Upload Store Packages as Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeroquery-ms-store-packages
          path: |
            Desktop/ZeroQuery.Desktop/AppPackages/**/*.msix
            Desktop/ZeroQuery.Desktop/AppPackages/**/*.msixupload
          if-no-files-found: error
          retention-days: 14

      - name: Attach Packages to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Desktop/ZeroQuery.Desktop/AppPackages/**/*.msix
            Desktop/ZeroQuery.Desktop/AppPackages/**/*.msixupload
          draft: false
          prerelease: false
          generate_release_notes: true
