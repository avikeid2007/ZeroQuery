name: Build & Package for Microsoft Store

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      package_version:
        description: 'Package Version (e.g. 1.0.1.0 - leave empty to keep current manifest version)'
        required: false
        default: ''
      platform:
        description: 'Target Architecture'
        required: true
        default: 'x64'
        type: choice
        options:
          - 'x64'
          - 'arm64'
          - 'both'

permissions:
  contents: write

jobs:
  build:
    name: Build MSIX (${{ github.event.inputs.platform || 'x64' }})
    runs-on: windows-latest

    env:
      # Single, deterministic root for every generated package. Each architecture gets its
      # own isolated subfolder (see Build-StorePackage.ps1) so artifact discovery never
      # needs to search/retry/guess across the whole repo afterward.
      PACKAGE_ROOT: ${{ github.workspace }}\StorePackages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup .NET SDK (10.0.x preview)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Install Frontend Dependencies & Export Desktop Client
        shell: pwsh
        run: |
          Write-Host "Building Next.js static client into Desktop wwwroot..."
          cd frontend
          npm ci
          npm run build:desktop
          cd ..

          $indexPath = "Desktop/ZeroQuery.Desktop/wwwroot/index.html"
          if (-not (Test-Path $indexPath)) {
              Write-Host "::error::Frontend build did not produce $indexPath"
              exit 1
          }
          Write-Host "Frontend export verified at $indexPath"

      - name: Install & Embed Microsoft Data API Builder (DAB) CLI
        shell: pwsh
        run: |
          Write-Host "Installing Microsoft Data API Builder CLI to temporary staging..."
          $stagingDab = Join-Path $env:RUNNER_TEMP "staging-dab"
          New-Item -ItemType Directory -Path $stagingDab -Force | Out-Null
          dotnet tool install --tool-path $stagingDab Microsoft.DataApiBuilder --ignore-failed-sources

          $binDir = (Get-ChildItem -Path $stagingDab -Recurse -Filter "Microsoft.DataApiBuilder.exe" | Select-Object -First 1).DirectoryName
          if (-not $binDir -or -not (Test-Path $binDir)) {
              Write-Error "Could not find Microsoft.DataApiBuilder.exe in $stagingDab!"
              exit 1
          }
          Write-Host "Found DAB binary directory: $binDir"

          # Flatten required binaries directly into Desktop/ZeroQuery.Desktop/tools/dab.
          # Copying only files (no subdirectories) avoids language satellite assemblies and
          # win-x64 folder naming that conflict with Windows App SDK MakePri resource indexing.
          $targetDir = "Desktop/ZeroQuery.Desktop/tools/dab"
          New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
          Get-ChildItem -Path $binDir -File | Copy-Item -Destination $targetDir -Force

          # Create dab.exe alias for Microsoft.DataApiBuilder.exe
          Copy-Item (Join-Path $targetDir "Microsoft.DataApiBuilder.exe") (Join-Path $targetDir "dab.exe") -Force

          Remove-Item -Path $stagingDab -Recurse -Force

          # Verify the embedded dab.exe runs standalone before it ever reaches packaging.
          $dabExe = Join-Path $targetDir "dab.exe"
          Write-Host "Verifying embedded DAB executable ($dabExe --version):"
          & $dabExe --version
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Embedded DAB failed version check!"
              exit 1
          }
          Write-Host "Successfully embedded standalone DAB CLI into $targetDir"

      - name: Update Package Version in Manifest
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.package_version }}"
          if (-not $ver -and "${{ github.ref }}" -match '^refs/tags/v?(\d+(\.\d+)*)$') {
              $ver = $Matches[1]
          }
          if ($ver) {
              $parts = $ver.Split('.')
              while ($parts.Count -lt 4) { $parts += '0' }
              $quad = ($parts[0..3] -join '.')
              Write-Host "Setting Package.appxmanifest Version to: $quad"
              $manifest = "Desktop/ZeroQuery.Desktop/Package.appxmanifest"
              [xml]$xml = Get-Content $manifest
              $xml.Package.Identity.Version = $quad
              $xml.Save((Resolve-Path $manifest))
          } else {
              Write-Host "Keeping existing Version in Package.appxmanifest"
          }

      - name: Build & Collect Store-Ready MSIX Package (x64)
        if: ${{ github.event.inputs.platform == 'x64' || github.event.inputs.platform == 'both' || github.event.inputs.platform == '' }}
        shell: pwsh
        run: ./.github/scripts/Build-StorePackage.ps1 -Platform x64 -PackageRoot $env:PACKAGE_ROOT

      - name: Build & Collect Store-Ready MSIX Package (ARM64)
        if: ${{ github.event.inputs.platform == 'arm64' || github.event.inputs.platform == 'both' }}
        shell: pwsh
        run: ./.github/scripts/Build-StorePackage.ps1 -Platform ARM64 -PackageRoot $env:PACKAGE_ROOT

      - name: Summarize Generated Store Packages
        shell: pwsh
        run: |
          Write-Host "Final contents of $env:PACKAGE_ROOT :"
          Get-ChildItem -Path $env:PACKAGE_ROOT -Recurse -File |
              Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload Store Packages as Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeroquery-ms-store-packages
          path: ${{ env.PACKAGE_ROOT }}\**\*
          if-no-files-found: error
          retention-days: 14

      - name: Attach Packages to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PACKAGE_ROOT }}\**\*
          draft: false
          prerelease: false
          generate_release_notes: true
